<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hermes-AI · ภารกิจล้มเจ้าพ่อเน็ตกาก</title>
<link rel="icon" type="image/png" sizes="256x256" href="favicon-256.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<style>
  :root{
    --glass:rgba(20,16,40,.55); --glass-border:rgba(255,255,255,.18);
    --text:#f5f5ff; --accent:#7c5cff; --accent2:#00e0ff;
    --hp:#39d98a; --mp:#5c9dff; --gold:#f4c95d; --shadow:rgba(0,0,0,.5);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);
    background:#0b0a1a;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}

  .stage-bg{position:fixed;inset:0;z-index:0;background:url('assets/battlefield.png') center/cover no-repeat;
    filter:saturate(1.05);}
  .stage-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,26,.55),rgba(11,10,26,.75));}

  .wrap{position:relative;z-index:1;width:min(96vw,640px);
    background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(10px);
    border-radius:22px;box-shadow:0 24px 60px var(--shadow);padding:18px 18px 20px;
    transform:translateY(18px);opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes rise{to{transform:translateY(0);opacity:1}}

  h1{font-size:clamp(18px,4.5vw,26px);text-align:center;margin-bottom:2px;
    background:linear-gradient(90deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .stage{text-align:center;font-size:12px;opacity:.8;margin-bottom:12px;letter-spacing:1px;color:var(--gold)}

  /* battlefield arena */
  .arena{position:relative;height:230px;display:flex;justify-content:space-between;align-items:flex-end;
    padding:0 14px 8px;border-radius:16px;overflow:hidden;margin-bottom:12px;
    background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.35));}
  .fighter{position:relative;text-align:center;width:42%}
  .fighter .char{height:170px;display:flex;align-items:flex-end;justify-content:center}
  .fighter img.spr{height:160px;width:auto;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45));
    animation:bob 3s ease-in-out infinite}
  .fighter.enemy img.spr{animation:bob 3s ease-in-out infinite reverse;transform:scaleX(-1)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .fighter.enemy img.spr{transform:scaleX(-1)}
  .fname{font-weight:800;font-size:14px;margin-top:2px;text-shadow:0 2px 4px rgba(0,0,0,.6)}
  .fighter.enemy .fname{color:#ffb3c0}

  /* hp/mp bars using UI panel art */
  .bars{margin-top:6px}
  .row{position:relative;height:18px;border-radius:10px;overflow:hidden;
    background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);margin:4px 0}
  .row>span{display:block;height:100%;transition:width .4s ease}
  .row.hp>span{background:linear-gradient(90deg,#39d98a,#23a6d5)}
  .row.mp>span{background:linear-gradient(90deg,#5c9dff,#7c5cff)}
  .row .lbl{position:absolute;inset:0;font-size:11px;line-height:18px;text-align:center;font-weight:800;
    color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .ico{width:14px;height:14px;vertical-align:-2px;margin-right:4px}

  .log{height:96px;overflow-y:auto;background:rgba(0,0,0,.35);border-radius:12px;padding:8px 10px;
    font-size:12.5px;line-height:1.55;margin-bottom:12px;border:1px solid rgba(255,255,255,.12)}
  .log p{margin:1px 0}
  .log .me{color:#b9a7ff}.log .foe{color:#ff9db0}.log .sys{color:#9fe6c9;font-style:italic}

  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .btn{border:none;cursor:pointer;font-size:14px;font-weight:800;color:#fff;padding:13px 6px;border-radius:14px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(124,92,255,.4);
    transition:transform .15s ease,box-shadow .15s ease}
  .btn:hover:not(:disabled){transform:translateY(-2px) scale(1.03);box-shadow:0 12px 26px rgba(0,224,255,.4)}
  .btn:active:not(:disabled){transform:translateY(0) scale(.97)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.heal{background:linear-gradient(90deg,#23a6d5,#39d98a)}

  .back{display:block;text-align:center;margin-top:12px;font-size:12px;opacity:.65}
  .back a{color:var(--accent2);text-decoration:none}

  .shake{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .overlay{position:fixed;inset:0;z-index:5;background:rgba(8,6,20,.85);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}
  .overlay.show{display:flex;animation:fade .4s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay h2{font-size:clamp(28px,8vw,52px);margin-bottom:8px}
  .overlay.win h2{background:linear-gradient(90deg,#39d98a,#00e0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .overlay.lose h2{background:linear-gradient(90deg,#ff5c7c,#ff9d5c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .overlay p{opacity:.85;margin-bottom:20px;max-width:420px}
  .overlay .btn{max-width:220px}
</style>
</head>
<body>
  <div class="stage-bg"></div>

  <div class="wrap">
    <h1>⚔️ ภารกิจล้มเจ้าพ่อเน็ตกาก</h1>
    <div class="stage" id="stageLabel">ด่านที่ 1 / 3</div>

    <div class="arena">
      <div class="fighter">
        <div class="char"><img class="spr" id="heroSpr" src="assets/knight.png" alt="hero"></div>
        <div class="fname" id="heroName">อัศวินมีมี่</div>
        <div class="bars">
          <div class="row hp"><span id="heroHpBar" style="width:100%"></span><div class="lbl" id="heroHpLbl"></div></div>
          <div class="row mp"><span id="heroMpBar" style="width:100%"></span><div class="lbl" id="heroMpLbl"></div></div>
        </div>
      </div>
      <div class="fighter enemy">
        <div class="char"><img class="spr" id="enemySpr" src="assets/slime.png" alt="enemy"></div>
        <div class="fname" id="enemyName">บอทกากเน็ต</div>
        <div class="bars">
          <div class="row hp"><span id="enemyHpBar" style="width:100%"></span><div class="lbl" id="enemyHpLbl"></div></div>
        </div>
      </div>
    </div>

    <div class="log" id="log"></div>

    <div class="actions">
      <button class="btn" id="btnAtk">⚔️ โจมตี</button>
      <button class="btn" id="btnSkill">✨ เวทมีมี่</button>
      <button class="btn heal" id="btnHeal">💚 ฮีล</button>
    </div>

    <div class="back"><a href="index.html">← กลับหน้าแรก</a></div>
  </div>

  <div class="overlay" id="overlay">
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <button class="btn" id="ovBtn">เล่นใหม่</button>
  </div>

<script src="game.js"></script>
<script>
(function(){
  const STAGE_NAMES = ['ด่านที่ 1 / 3 — บอทกากเน็ต','ด่านที่ 2 / 3 — ไวรัสจอมจุ้น','ด่านที่ 3 / 3 — เจ้าพ่อเน็ตกาก 👹'];
  const SPR = { hero:'assets/knight.png', slime:'assets/slime.png', virus:'assets/virus.png', dragon:'assets/dragon.png' };
  let hero, enemy, stage, busy;
  const $ = id => document.getElementById(id);
  const log = $('log');

  function addLog(t,c){const p=document.createElement('p');p.className=c||'sys';p.textContent=t;log.appendChild(p);log.scrollTop=log.scrollHeight;}
  function render(){
    $('heroHpBar').style.width=(hero.hp/hero.maxHp*100)+'%';
    $('heroMpBar').style.width=(hero.mp/hero.maxMp*100)+'%';
    $('heroHpLbl').textContent='HP '+hero.hp+'/'+hero.maxHp;
    $('heroMpLbl').textContent='MP '+hero.mp+'/'+hero.maxMp;
    $('enemyHpBar').style.width=(enemy.hp/enemy.maxHp*100)+'%';
    $('enemyHpLbl').textContent='HP '+enemy.hp+'/'+enemy.maxHp;
    $('enemyName').textContent=enemy.name;
    $('enemySpr').src=enemy.spriteImg;
    $('heroName').textContent=hero.name;
    $('stageLabel').textContent=STAGE_NAMES[stage];
  }
  function shake(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),300);}

  function startGame(){
    stage=0; hero=createHero(); enemy=createEnemy(stage); busy=false;
    log.innerHTML=''; addLog('อัศวินมีมี่: ลูกพี่สั่งมา มีมี่จัดการเจ้าพ่อเน็ตกาก! ⚔️','sys');
    render(); setButtons(true);
  }
  function setButtons(on){['btnAtk','btnSkill','btnHeal'].forEach(id=>$(id).disabled=!on);}

  function heroAct(type){
    if(busy)return; busy=true; setButtons(false);
    if(type==='attack'){const d=basicAttack(hero,enemy);addLog('อัศวินมีมี่ โจมตี '+enemy.name+' -'+d,'me');shake($('enemySpr'));}
    else if(type==='skill'){const r=skillAttack(hero,enemy);if(r.fail){const d=basicAttack(hero,enemy);addLog('MP ไม่พอ! โจมตี -'+d,'me');shake($('enemySpr'));}else{addLog('อัศวินมีมี่ ใช้ "เวทมีมี่" -'+r.dmg+' ✨','me');shake($('enemySpr'));}}
    else if(type==='heal'){const r=healAction(hero);if(r.fail){const d=basicAttack(hero,enemy);addLog('MP ไม่พอ! โจมตี -'+d,'me');shake($('enemySpr'));}else{addLog('อัศวินมีมี่ ฮีลตัวเอง +'+r.amount+' 💚','me');shake($('heroSpr'));}}
    render();
    if(battleState(hero,enemy)==='win')return onWin();
    setTimeout(enemyAct,650);
  }
  function enemyAct(){
    const e=enemyTurn(enemy,hero);
    addLog(enemy.name+' '+(e.type==='heavy'?'ตบหนัก':'โจมตี')+' -'+e.dmg,'foe');shake($('heroSpr'));render();
    const st=battleState(hero,enemy);
    if(st==='lose')return onLose();
    if(st==='win')return onWin();
    busy=false; setButtons(true);
  }
  function onWin(){
    if(stage<2){
      stage++; addLog('🎉 ชนะ '+enemy.name+'! ผ่านด่านถัดไป','sys');
      enemy=createEnemy(stage);
      hero.hp=Math.min(hero.maxHp,hero.hp+25); hero.mp=Math.min(hero.maxMp,hero.mp+15);
      busy=false; render(); setButtons(true);
    } else {
      showOverlay(true,'🏆 VICTORY!','อัศวินมีมี่จัดเจ้าพ่อเน็ตกากเรียบร้อย ลูกพี่เน็ตลื่นปรื้ดแล้ว! 💜');
    }
  }
  function onLose(){showOverlay(false,'💀 DEFEAT','อัศวินมีมี่สู้ไม่ไหวแล้ว ลูกพี่... รีแมตช์ไหมคะ?');}
  function showOverlay(win,title,text){
    const ov=$('overlay'); ov.className='overlay show '+(win?'win':'lose');
    $('ovTitle').textContent=title; $('ovText').textContent=text; setButtons(false);
  }
  $('btnAtk').addEventListener('click',()=>heroAct('attack'));
  $('btnSkill').addEventListener('click',()=>heroAct('skill'));
  $('btnHeal').addEventListener('click',()=>heroAct('heal'));
  $('ovBtn').addEventListener('click',()=>{$('overlay').className='overlay';startGame();});
  startGame();
})();
</script>
</body>
</html>
