<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hermes-AI · Hello World</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --glass: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.18);
    --text: #f5f5ff;
    --accent: #7c5cff;
    --accent-2: #00e0ff;
    --shadow: rgba(0, 0, 0, 0.35);
  }
  [data-theme="light"] {
    --bg-1: #e0e7ff;
    --bg-2: #f5f3ff;
    --bg-3: #ffffff;
    --glass: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.9);
    --text: #1a1530;
    --accent: #6d3bff;
    --accent-2: #0091ad;
    --shadow: rgba(80, 60, 160, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-2));
    background-size: 400% 400%;
    animation: gradientShift 18s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: color 0.4s ease;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* floating orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    z-index: 0;
    animation: float 14s ease-in-out infinite;
  }
  .orb.a { width: 320px; height: 320px; background: var(--accent); top: -80px; left: -60px; }
  .orb.b { width: 280px; height: 280px; background: var(--accent-2); bottom: -100px; right: -40px; animation-delay: -7s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -40px) scale(1.1); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: min(92vw, 460px);
    padding: 48px 40px;
    border-radius: 28px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 24px 60px var(--shadow);
    text-align: center;
    transform: translateY(24px);
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes rise {
    to { transform: translateY(0); opacity: 1; }
  }

  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #fff;
    margin-bottom: 22px;
  }

  h1 {
    font-size: clamp(34px, 8vw, 52px);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(90deg, var(--text), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1 .wave { display: inline-block; animation: wave 2.2s ease-in-out infinite; transform-origin: 70% 70%; }
  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0deg); }
    10% { transform: rotate(14deg); }
    20% { transform: rotate(-8deg); }
    30% { transform: rotate(14deg); }
    40% { transform: rotate(-4deg); }
    50% { transform: rotate(10deg); }
  }

  p.sub {
    margin: 16px 0 30px;
    font-size: 15px;
    opacity: 0.78;
    line-height: 1.6;
  }

  .btn {
    position: relative;
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    padding: 14px 34px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 26px rgba(124, 92, 255, 0.45);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    overflow: hidden;
  }
  .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 34px rgba(0, 224, 255, 0.45); }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn::after {
    content: "";
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.25);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .btn:active::after { opacity: 1; transition: none; }

  .counter {
    margin-top: 22px;
    font-size: 13px;
    opacity: 0.7;
  }
  .counter b { color: var(--accent-2); font-size: 15px; }

  .theme-toggle {
    position: fixed;
    top: 22px; right: 22px;
    z-index: 2;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    backdrop-filter: blur(12px);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.3s ease;
  }
  .theme-toggle:hover { transform: rotate(20deg) scale(1.05); }

  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    z-index: 3;
    padding: 14px 26px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    color: var(--text);
    font-size: 14px;
    box-shadow: 0 12px 30px var(--shadow);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.16,1,0.3,1), opacity 0.45s ease;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <button class="theme-toggle" id="themeBtn" title="สลับธีม">🌙</button>

  <main class="card">
    <span class="badge">Hermes-AI</span>
    <h1>Hello World <span class="wave">👋</span></h1>
    <p class="sub">นี่คือจุดเริ่มต้นของโปรเจกต์ Hermes-AI<br />สร้างโดย มีมี่ — ลูกน้องของลูกพี่ 💜</p>
    <button class="btn" id="helloBtn">ทักทายลูกพี่</button>
    <div class="counter">กดไปแล้ว <b id="count">0</b> ครั้ง</div>
  </main>

  <div class="toast" id="toast">สวัสดีค่ะ ลูกพี่! มีมี่พร้อมรับใช้เสมอ 💜</div>

<script>
  const btn = document.getElementById('helloBtn');
  const countEl = document.getElementById('count');
  const toast = document.getElementById('toast');
  const themeBtn = document.getElementById('themeBtn');
  let count = 0;
  let toastTimer = null;

  btn.addEventListener('click', () => {
    count++;
    countEl.textContent = count;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  });

  themeBtn.addEventListener('click', () => {
    const root = document.documentElement;
    const isLight = root.getAttribute('data-theme') === 'light';
    root.setAttribute('data-theme', isLight ? 'dark' : 'light');
    themeBtn.textContent = isLight ? '🌙' : '☀️';
  });
</script>
</body>
</html>
