<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hermes-AI · ผจญภัยบนแผนที่</title>
<link rel="icon" type="image/png" sizes="256x256" href="favicon-256.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<style>
  :root{--glass:rgba(20,16,40,.55);--glass-border:rgba(255,255,255,.18);--text:#f5f5ff;--accent:#7c5cff;--accent2:#00e0ff;--gold:#f4c95d;--shadow:rgba(0,0,0,.5);}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:#0b0a1a;
    display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
  .stage-bg{position:fixed;inset:0;z-index:0;background:url('assets/battlefield.png') center/cover no-repeat;filter:saturate(1.05);}
  .stage-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,26,.5),rgba(11,10,26,.7));}
  .wrap{position:relative;z-index:1;width:min(96vw,560px);background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(10px);border-radius:22px;box-shadow:0 24px 60px var(--shadow);padding:18px;
    transform:translateY(18px);opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes rise{to{transform:translateY(0);opacity:1}}
  h1{font-size:clamp(18px,4.5vw,24px);text-align:center;margin-bottom:2px;
    background:linear-gradient(90deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hint{text-align:center;font-size:12px;opacity:.8;margin-bottom:10px;color:var(--gold)}
  /* map grid */
  .map{display:grid;gap:2px;background:rgba(0,0,0,.3);padding:6px;border-radius:14px;margin:0 auto 12px;width:max-content;max-width:100%}
  .cell{width:46px;height:46px;border-radius:8px;background:rgba(255,255,255,.05);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cell.road{background:rgba(244,201,93,.18)}
  .cell img{width:40px;height:40px;object-fit:contain;image-rendering:auto}
  .cell .hero{filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
  .cell.foe img{animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .cell.cleared{opacity:.35}
  /* dpad */
  .pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:8px;justify-content:center;margin-bottom:10px}
  .pad button{border:none;border-radius:14px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(124,92,255,.4);transition:transform .12s}
  .pad button:active{transform:scale(.94)}
  .pad .empty{background:transparent;box-shadow:none;cursor:default}
  .keys{text-align:center;font-size:12px;opacity:.7;margin-bottom:10px}
  .progress{display:flex;justify-content:center;gap:10px;margin-bottom:8px}
  .progress .dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.2)}
  .progress .dot.done{background:var(--hp,#39d98a);box-shadow:0 0 10px #39d98a}
  .back{display:block;text-align:center;margin-top:10px;font-size:12px;opacity:.65}
  .back a{color:var(--accent2);text-decoration:none}
  /* battle overlay */
  .overlay{position:fixed;inset:0;z-index:6;background:rgba(8,6,20,.92);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;flex-direction:column;padding:18px}
  .overlay.show{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay h2{font-size:clamp(20px,6vw,30px);margin-bottom:10px;text-align:center;
    background:linear-gradient(90deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .arena{position:relative;height:230px;display:flex;justify-content:space-around;align-items:flex-end;width:min(94vw,480px);margin-bottom:12px;
    border-radius:18px;overflow:hidden;
    background:url('assets/battlefield.png') center/cover no-repeat, linear-gradient(180deg,#1a1430,#0d0a1f);
    box-shadow:inset 0 0 60px rgba(0,0,0,.7), 0 10px 30px rgba(0,0,0,.5)}
  .arena::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,10,31,.35),rgba(13,10,31,.75))}
  .fighter{position:relative;z-index:1;text-align:center;width:42%}
  .fighter img{height:160px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(124,92,255,.55));animation:bob 3s ease-in-out infinite}
  .fighter.enemy img{transform:scaleX(-1);animation:bob 3s ease-in-out infinite reverse;filter:drop-shadow(0 0 14px rgba(255,92,124,.5))}
  .fname{font-weight:800;font-size:14px;margin-top:4px;text-shadow:0 2px 6px rgba(0,0,0,.8);color:#eaf6ff}
  .fighter.enemy .fname{color:#ffc2cf}
  .row{position:relative;height:16px;border-radius:9px;overflow:hidden;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.18);margin:4px auto;max-width:190px}
  .row>span{display:block;height:100%;transition:width .35s ease}
  .row.hp>span{background:linear-gradient(90deg,#39d98a,#23a6d5)}
  .row.mp>span{background:linear-gradient(90deg,#5c9dff,#7c5cff)}
  .row .lbl{position:absolute;inset:0;font-size:10px;line-height:16px;text-align:center;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .log{height:88px;overflow-y:auto;background:rgba(0,0,0,.4);border-radius:10px;padding:6px 8px;font-size:12px;line-height:1.5;margin-bottom:10px;width:min(94vw,480px);border:1px solid rgba(124,92,255,.3);box-shadow:0 0 18px rgba(124,92,255,.15)}
  .log p{margin:1px 0}.log .me{color:#c9bbff}.log .foe{color:#ff9db0}.log .sys{color:#9fe6c9;font-style:italic}
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(94vw,480px)}
  .overlay .btn{border:none;cursor:pointer;font-size:14px;font-weight:800;color:#fff;padding:12px 4px;border-radius:14px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(124,92,255,.45)}
  .overlay .btn:hover:not(:disabled){transform:translateY(-2px)}
  .overlay .btn.heal{background:linear-gradient(90deg,#23a6d5,#39d98a)}
  .overlay .btn:disabled{opacity:.4;cursor:not-allowed}
  .shake{animation:shake .3s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  /* attack lunge: hero/enemy darts toward the opponent */
  .lunge-right{animation:lungeR .35s ease}
  .lunge-left{animation:lungeL .35s ease}
  @keyframes lungeR{0%{transform:translateX(0)}40%{transform:translateX(55px)}100%{transform:translateX(0)}}
  @keyframes lungeL{0%{transform:translateX(0)}40%{transform:translateX(-55px)}100%{transform:translateX(0)}}
  /* enemy faces left, so its lunge is mirrored */
  .fighter.enemy.lunge-left img{animation:lungeLmirror .35s ease}
  .fighter.enemy.lunge-right img{animation:lungeRmirror .35s ease}
  @keyframes lungeRmirror{0%{transform:scaleX(-1) translateX(0)}40%{transform:scaleX(-1) translateX(-55px)}100%{transform:scaleX(-1) translateX(0)}}
  @keyframes lungeLmirror{0%{transform:scaleX(-1) translateX(0)}40%{transform:scaleX(-1) translateX(55px)}100%{transform:scaleX(-1) translateX(0)}}
  /* take-damage: flash red + recoil */
  .hurt{animation:hurt .4s ease}
  @keyframes hurt{0%,100%{filter:drop-shadow(0 0 14px rgba(255,92,124,.5)) brightness(1)}
    30%{filter:drop-shadow(0 0 22px rgba(255,40,40,.95)) brightness(2.2) sepia(1) hue-rotate(-50deg) saturate(6);transform:translateX(8px) rotate(2deg)}}
  .fighter.enemy.hurt img{animation:hurtE .4s ease}
  @keyframes hurtE{0%,100%{filter:drop-shadow(0 0 14px rgba(255,92,124,.5)) brightness(1)}
    30%{filter:drop-shadow(0 0 22px rgba(255,40,40,.95)) brightness(2.2) sepia(1) hue-rotate(-50deg) saturate(6);transform:scaleX(-1) translateX(8px) rotate(2deg)}}
  /* skill cast: burst of magic */
  .casting{animation:cast .5s ease}
  @keyframes cast{0%{filter:drop-shadow(0 0 14px rgba(124,92,255,.55)) brightness(1)}
    40%{filter:drop-shadow(0 0 30px rgba(180,120,255,1)) brightness(1.8) saturate(1.6)}100%{filter:drop-shadow(0 0 14px rgba(124,92,255,.55)) brightness(1)}}
  /* skill impact on enemy */
  .skillhit{animation:skillhit .6s ease}
  @keyframes skillhit{0%{filter:drop-shadow(0 0 14px rgba(255,92,124,.5))}
    35%{filter:drop-shadow(0 0 34px rgba(180,120,255,1)) brightness(2.4) saturate(2)}60%{transform:scale(1.12) scaleX(-1)}100%{transform:scaleX(-1)}}
  /* floating damage number */
  .dmg{position:absolute;z-index:5;font-weight:900;font-size:26px;color:#ff5a6e;text-shadow:0 2px 6px #000,0 0 10px #ff2a44;pointer-events:none;animation:floatUp .9s ease forwards}
  .dmg.heal{color:#5dffa0;text-shadow:0 2px 6px #000,0 0 10px #19ff7a}
  @keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
  /* defeated hero */
  .defeated{animation:fadeOut .8s ease forwards}
  @keyframes fadeOut{to{opacity:.15;filter:grayscale(1) brightness(.5)}}
  @media (prefers-reduced-motion:reduce){.fighter img{animation:none!important}.lunge-right,.lunge-left,.hurt,.casting,.skillhit{animation:none!important}}
</style>
</head>
<body>
  <div class="stage-bg"></div>
  <div class="wrap">
    <h1>🗺️ ผจญภัยล้มเจ้าพ่อเน็ตกาก</h1>
    <div class="hint">ใช้ปุ่ม WASD / ลูกศร / แป้นพิมพ์ เพื่อเดินหามอนสเตอร์</div>
    <div class="progress" id="progress"></div>
    <div class="map" id="map"></div>
    <div class="pad">
      <div class="empty"></div><button data-dir="up">▲</button><div class="empty"></div>
      <button data-dir="left">◀</button><div class="empty"></div><button data-dir="right">▶</button>
      <div class="empty"></div><button data-dir="down">▼</button><div class="empty"></div>
    </div>
    <div class="keys">⌨️ W A S D หรือ ลูกศรทิศทาง</div>
    <div class="back"><a href="index.html">← กลับหน้าแรก</a> · <a href="game.html">โหมดต่อสู้เดิม</a></div>
  </div>

  <!-- battle overlay -->
  <div class="overlay" id="battle">
    <h2 id="bTitle"></h2>
    <div class="arena">
      <div class="fighter"><img id="bHero" src="assets/knight.png"><div class="fname">อัศวินมีมี่</div>
        <div class="row hp"><span id="bHeroHp"></span><div class="lbl" id="bHeroHpL"></div></div>
        <div class="row mp"><span id="bHeroMp"></span><div class="lbl" id="bHeroMpL"></div></div></div>
      <div class="fighter enemy"><img id="bEnemy" src="assets/slime.png" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div style=\'font-size:80px\'>🤖</div>')"><div class="fname" id="bEnemyName"></div>
        <div class="row hp"><span id="bEnemyHp"></span><div class="lbl" id="bEnemyHpL"></div></div></div>
    </div>
    <div class="log" id="bLog"></div>
    <div class="actions">
      <button class="btn" id="bAtk">⚔️ โจมตี</button>
      <button class="btn" id="bSkill">✨ เวทมีมี่</button>
      <button class="btn heal" id="bHeal">💚 ฮีล</button>
    </div>
  </div>

<script src="game.js"></script>
<script>
(function(){
  // ---- Map setup ----
  const COLS=7, ROWS=7;
  // 0 = grass, 1 = road, monsters at given coords
  const grid = Array.from({length:ROWS},()=>Array(COLS).fill(0));
  // mark a winding road
  const road=[[3,0],[3,1],[3,2],[3,3],[2,3],[1,3],[1,4],[1,5],[2,5],[3,5],[4,5],[4,4],[4,3]];
  road.forEach(([r,c])=>grid[r][c]=1);
  // hero start
  let pos={r:3,c:0};
  // monsters: stage 0,1,2 placed on map
  const monsters=[
    {stage:0, r:1, c:3, name:'บอทกากเน็ต', img:'assets/slime.png', alive:true},
    {stage:1, r:4, c:4, name:'ไวรัสจอมจุ้น', img:'assets/virus.png', alive:true},
    {stage:2, r:3, c:6, name:'เจ้าพ่อเน็ตกาก', img:'assets/dragon.png', alive:true},
  ];
  const ENEMY_IMG=['assets/slime.png','assets/virus.png','assets/dragon.png'];

  const mapEl=document.getElementById('map');
  const progressEl=document.getElementById('progress');
  function buildMap(){
    mapEl.style.gridTemplateColumns=`repeat(${COLS},46px)`;
    mapEl.innerHTML='';
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const cell=document.createElement('div');
        cell.className='cell'+(grid[r][c]?' road':'');
        cell.dataset.r=r; cell.dataset.c=c;
        if(pos.r===r&&pos.c===c){
          const h=document.createElement('img');h.src='assets/knight.png';h.className='hero';cell.appendChild(h);
        }
        const m=monsters.find(m=>m.alive&&m.r===r&&m.c===c);
        if(m){const i=document.createElement('img');i.src=m.img;cell.classList.add('foe');cell.appendChild(i);}
        mapEl.appendChild(cell);
      }
    }
    // progress dots
    progressEl.innerHTML='';
    monsters.forEach(m=>{const d=document.createElement('div');d.className='dot'+(m.alive?'':' done');progressEl.appendChild(d);});
  }

  // ---- Movement ----
  function move(dr,dc){
    if(battleOpen)return;
    const nr=pos.r+dr, nc=pos.c+dc;
    if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return;
    pos={r:nr,c:nc};
    buildMap();
    const m=monsters.find(m=>m.alive&&m.r===nr&&m.c===nc);
    if(m){ startBattle(m); }
  }
  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k==='w'||k==='arrowup')move(-1,0);
    else if(k==='s'||k==='arrowdown')move(1,0);
    else if(k==='a'||k==='arrowleft')move(0,-1);
    else if(k==='d'||k==='arrowright')move(0,1);
  });
  document.querySelectorAll('.pad button[data-dir]').forEach(b=>{
    b.addEventListener('click',()=>{const d=b.dataset.dir;
      if(d==='up')move(-1,0);if(d==='down')move(1,0);if(d==='left')move(0,-1);if(d==='right')move(0,1);});
  });

  // ---- Battle (reuses game.js logic) ----
  let battleOpen=false, curMonster=null, hero=null, enemy=null, busy=false;
  const $=id=>document.getElementById(id);
  const bLog=$('bLog');
  function bAdd(t,cls){const p=document.createElement('p');p.className=cls||'sys';p.textContent=t;bLog.appendChild(p);bLog.scrollTop=bLog.scrollHeight;}
  function bRender(){
    $('bHeroHp').style.width=(hero.hp/hero.maxHp*100)+'%';
    $('bHeroMp').style.width=(hero.mp/hero.maxMp*100)+'%';
    $('bHeroHpL').textContent='HP '+hero.hp+'/'+hero.maxHp;
    $('bHeroMpL').textContent='MP '+hero.mp+'/'+hero.maxMp;
    $('bEnemyHp').style.width=(enemy.hp/enemy.maxHp*100)+'%';
    $('bEnemyHpL').textContent='HP '+enemy.hp+'/'+enemy.maxHp;
    $('bEnemyName').textContent=enemy.name;
    $('bEnemy').src = bImg((curMonster && curMonster.img) ? curMonster.img : (enemy.spriteImg || enemy.sprite || ''));
    $('bHero').src = bImg('assets/knight.png');
  }
  function bSet(on){['bAtk','bSkill','bHeal'].forEach(id=>$(id).disabled=!on);}
  function startBattle(m){
    battleOpen=true; curMonster=m; busy=false;
    hero=createHero(); enemy=createEnemy(m.stage);
    bLog.innerHTML=''; bAdd('⚔️ เจอ '+m.name+'! การต่อสู้เริ่มต้น','sys');
    $('bTitle').textContent='⚔️ ต่อสู้กับ '+m.name;
    $('battle').classList.add('show'); bRender(); bSet(true);
  }
  function bImg(src){ return src + '?v=2'; } // cache-bust: force fresh transparent sprites
  function bAct(type){
    if(busy)return; busy=true; bSet(false);
    const heroF=$('bHero').parentElement, enemyF=$('bEnemy').parentElement;
    if(type==='attack'){
      const d=basicAttack(hero,enemy);
      heroF.classList.add('lunge-right'); setTimeout(()=>heroF.classList.remove('lunge-right'),360);
      setTimeout(()=>{enemyF.classList.add('hurt'); floatDmg(enemyF,d); setTimeout(()=>enemyF.classList.remove('hurt'),400);},330);
      bAdd('อัศวินมีมี่ โจมตี -'+d,'me');
    }
    else if(type==='skill'){
      const r=skillAttack(hero,enemy);
      if(r.fail){const d=basicAttack(hero,enemy);
        heroF.classList.add('lunge-right'); setTimeout(()=>heroF.classList.remove('lunge-right'),360);
        setTimeout(()=>{enemyF.classList.add('hurt'); floatDmg(enemyF,d); setTimeout(()=>enemyF.classList.remove('hurt'),400);},330);
        bAdd('MP ไม่พอ! โจมตี -'+d,'me');
      }else{
        $('bHero').classList.add('casting'); setTimeout(()=>$('bHero').classList.remove('casting'),500);
        setTimeout(()=>{enemyF.classList.add('skillhit'); floatDmg(enemyF,r.dmg,'#c9a3ff'); setTimeout(()=>enemyF.classList.remove('skillhit'),600);},300);
        bAdd('อัศวินมีมี่ ใช้ "เวทมีมี่" -'+r.dmg+' ✨','me');
      }
    }
    else if(type==='heal'){
      const r=healAction(hero);
      if(r.fail){const d=basicAttack(hero,enemy);
        heroF.classList.add('lunge-right'); setTimeout(()=>heroF.classList.remove('lunge-right'),360);
        setTimeout(()=>{enemyF.classList.add('hurt'); floatDmg(enemyF,d); setTimeout(()=>enemyF.classList.remove('hurt'),400);},330);
        bAdd('MP ไม่พอ! โจมตี -'+d,'me');
      }else{
        $('bHero').classList.add('casting'); setTimeout(()=>$('bHero').classList.remove('casting'),500);
        floatDmg(heroF,r.amount,'#5dffa0',true);
        bAdd('อัศวินมีมี่ ฮีล +'+r.amount+' 💚','me');
      }
    }
    bRender();
    if(battleState(hero,enemy)==='win')return bWin();
    setTimeout(bEnemyTurn,720);
  }
  function bEnemyTurn(){
    const e=enemyTurn(enemy,hero);
    const heroF=$('bHero').parentElement, enemyF=$('bEnemy').parentElement;
    enemyF.classList.add('lunge-left'); setTimeout(()=>enemyF.classList.remove('lunge-left'),360);
    setTimeout(()=>{heroF.classList.add('hurt'); floatDmg(heroF,e.dmg); setTimeout(()=>heroF.classList.remove('hurt'),400);},330);
    bAdd(enemy.name+' '+(e.type==='heavy'?'ตบหนัก':'โจมตี')+' -'+e.dmg,'foe');
    bRender();
    const st=battleState(hero,enemy);
    if(st==='lose')return bLose();
    if(st==='win')return bWin();
    busy=false; bSet(true);
  }
  function floatDmg(fighterEl, amount, color, isHeal){
    const arena=$('battle').querySelector('.arena');
    const el=document.createElement('div');
    el.className='dmg'+(isHeal?' heal':'');
    el.textContent=(isHeal?'+':'-')+amount;
    if(color) el.style.color=color;
    const rect=fighterEl.getBoundingClientRect();
    const arect=arena.getBoundingClientRect();
    el.style.left=(rect.left-arect.left+rect.width/2-14)+'px';
    el.style.top=(rect.top-arect.top+10)+'px';
    arena.appendChild(el);
    setTimeout(()=>el.remove(),900);
  }
  function bWin(){
    curMonster.alive=false;
    bAdd('🎉 ชนะ '+curMonster.name+'!','sys');
    const left=monsters.filter(m=>m.alive).length;
    setTimeout(()=>{
      $('battle').classList.remove('show');
      battleOpen=false;
      buildMap();
      if(left===0){
        // victory
        overlayEnd(true);
      }
    },900);
  }
  function bLose(){
    bAdd('💀 อัศวินมีมี่ล้มลง...','foe');
    $('bHero').classList.add('defeated');
    setTimeout(()=>{ $('battle').classList.remove('show'); battleOpen=false; overlayEnd(false); },1100);
  }
  $('bAtk').addEventListener('click',()=>bAct('attack'));
  $('bSkill').addEventListener('click',()=>bAct('skill'));
  $('bHeal').addEventListener('click',()=>bAct('heal'));

  // ---- end overlay ----
  const ovEnd=document.createElement('div');
  ovEnd.className='overlay'; ovEnd.id='ovEnd';
  ovEnd.innerHTML='<h2 id="ovEndT"></h2><p id="ovEndP" style="opacity:.85;margin-bottom:20px"></p><button class="btn" id="ovEndBtn" style="max-width:220px">เริ่มใหม่</button>';
  document.body.appendChild(ovEnd);
  function overlayEnd(win){
    ovEnd.className='overlay show '+(win?'win':'lose');
    $('ovEndT').textContent=win?'🏆 ผจญภัยสำเร็จ!':'💀 พ่ายแพ้';
    $('ovEndP').textContent=win?'อัศวินมีมี่โค่นเจ้าพ่อเน็ตกากครบทุกด่าน ลูกพี่เน็ตลื่นปรื้ดแล้ว! 💜':'อัศวินมีมี่สู้ไม่ไหว ลูกพี่... รีแมตช์ไหมคะ?';
  }
  $('ovEndBtn').addEventListener('click',()=>{
    ovEnd.className='overlay';
    monsters.forEach(m=>m.alive=true);
    pos={r:3,c:0};
    buildMap();
  });

  // init
  buildMap();
})();
</script>
</body>
</html>
